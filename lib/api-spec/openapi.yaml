        date:
          type: string
          format: date
        venue:
          type: ["string", "null"]
        homeTeam:
          type: string
        awayTeam:
          type: string
        homeTeamShort:
          type: ["string", "null"]
        awayTeamShort:
          type: ["string", "null"]
        homeTeamColour:
          type: ["string", "null"]
        awayTeamColour:
          type: ["string", "null"]
        operator:
          type: ["string", "null"]
        scheduledStart:
          type: ["string", "null"]
