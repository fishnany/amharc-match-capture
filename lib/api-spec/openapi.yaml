openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AMHARC Match Capture — Local Agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: System status and monitoring
  - name: cameras
    description: Camera management
  - name: matches
    description: Match management
  - name: events
    description: Match event tagging
  - name: recording
    description: Recording control
  - name: streaming
    description: Live streaming control
  - name: storage
    description: Storage monitoring
  - name: devices
    description: Peripheral device management
  - name: overlays
    description: Broadcast overlay management
  - name: exports
    description: Data export

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /system/status:
    get:
      operationId: getSystemStatus
      tags: [system]
      summary: Get full system status
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /cameras:
    get:
      operationId: getCameras
      tags: [cameras]
      summary: List all configured cameras
      responses:
        "200":
          description: Camera list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Camera"
    post:
      operationId: createCamera
      tags: [cameras]
      summary: Add a new camera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraInput"
      responses:
        "201":
          description: Camera created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"

  /cameras/{cameraId}:
    get:
      operationId: getCamera
      tags: [cameras]
      summary: Get camera details
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Camera
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
        "404":
          description: Not found
    put:
      operationId: updateCamera
      tags: [cameras]
      summary: Update camera configuration
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CameraInput"
      responses:
        "200":
          description: Camera updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Camera"
    delete:
      operationId: deleteCamera
      tags: [cameras]
      summary: Remove a camera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /cameras/{cameraId}/connect:
    post:
      operationId: connectCamera
      tags: [cameras]
      summary: Connect to camera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraConnectionResult"

  /cameras/{cameraId}/disconnect:
    post:
      operationId: disconnectCamera
      tags: [cameras]
      summary: Disconnect from camera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /cameras/{cameraId}/test:
    post:
      operationId: testCamera
      tags: [cameras]
      summary: Test camera connection
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CameraTestResult"

  /cameras/{cameraId}/ptz:
    post:
      operationId: sendPtzCommand
      tags: [cameras]
      summary: Send PTZ command to camera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PtzCommand"
      responses:
        "200":
          description: PTZ command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /cameras/{cameraId}/presets:
    get:
      operationId: getCameraPresets
      tags: [cameras]
      summary: List PTZ presets for camera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PtzPreset"
    post:
      operationId: saveCameraPreset
      tags: [cameras]
      summary: Save PTZ preset
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PtzPresetInput"
      responses:
        "201":
          description: Preset saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PtzPreset"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: List all matches
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a new match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Match created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match details
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
    put:
      operationId: updateMatch
      tags: [matches]
      summary: Update match details
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{matchId}/start:
    post:
      operationId: startMatch
      tags: [matches]
      summary: Start a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /matches/{matchId}/stop:
    post:
      operationId: stopMatch
      tags: [matches]
      summary: Stop a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /matches/{matchId}/clock/start:
    post:
      operationId: startMatchClock
      tags: [matches]
      summary: Start match clock
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clock started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

  /matches/{matchId}/clock/pause:
    post:
      operationId: pauseMatchClock
      tags: [matches]
      summary: Pause match clock
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clock paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

  /matches/{matchId}/clock/resume:
    post:
      operationId: resumeMatchClock
      tags: [matches]
      summary: Resume match clock
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clock resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

  /matches/{matchId}/clock/correct:
    post:
      operationId: correctMatchClock
      tags: [matches]
      summary: Manually correct match clock
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockCorrection"
      responses:
        "200":
          description: Clock corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

  /matches/{matchId}/clock:
    get:
      operationId: getMatchClock
      tags: [matches]
      summary: Get match clock state
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Clock state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockState"

  /matches/{matchId}/score:
    get:
      operationId: getMatchScore
      tags: [matches]
      summary: Get current match score
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Score state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreState"
    put:
      operationId: updateMatchScore
      tags: [matches]
      summary: Update match score
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreUpdate"
      responses:
        "200":
          description: Score updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreState"

  /matches/{matchId}/events:
    get:
      operationId: getMatchEvents
      tags: [events]
      summary: Get match events
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"
    post:
      operationId: createMatchEvent
      tags: [events]
      summary: Create a match event
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"

  /matches/{matchId}/events/{eventId}:
    put:
      operationId: updateMatchEvent
      tags: [events]
      summary: Update a match event
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchEventUpdate"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"
    delete:
      operationId: deleteMatchEvent
      tags: [events]
      summary: Delete a match event
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /matches/{matchId}/events/undo:
    post:
      operationId: undoLastEvent
      tags: [events]
      summary: Undo the last event
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /matches/{matchId}/recording/start:
    post:
      operationId: startRecording
      tags: [recording]
      summary: Start recording
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recording started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /matches/{matchId}/recording/stop:
    post:
      operationId: stopRecording
      tags: [recording]
      summary: Stop recording
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recording stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /matches/{matchId}/recording/status:
    get:
      operationId: getRecordingStatus
      tags: [recording]
      summary: Get recording status
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recording status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatus"

  /matches/{matchId}/streaming/start:
    post:
      operationId: startStreaming
      tags: [streaming]
      summary: Start live stream
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamingStatus"

  /matches/{matchId}/streaming/stop:
    post:
      operationId: stopStreaming
      tags: [streaming]
      summary: Stop live stream
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stream stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamingStatus"

  /matches/{matchId}/streaming/status:
    get:
      operationId: getStreamingStatus
      tags: [streaming]
      summary: Get streaming status
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streaming status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamingStatus"

  /matches/{matchId}/export:
    post:
      operationId: exportMatch
      tags: [exports]
      summary: Export match data package
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

  /storage/status:
    get:
      operationId: getStorageStatus
      tags: [storage]
      summary: Get storage status
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"

  /devices:
    get:
      operationId: getDevices
      tags: [devices]
      summary: List all connected devices
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"

  /devices/stream-deck:
    get:
      operationId: getStreamDeckStatus
      tags: [devices]
      summary: Get Stream Deck status
      responses:
        "200":
          description: Stream Deck status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamDeckStatus"

  /devices/joystick:
    get:
      operationId: getJoystickStatus
      tags: [devices]
      summary: Get joystick status
      responses:
        "200":
          description: Joystick status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoystickStatus"

  /stream-deck/profiles:
    get:
      operationId: getStreamDeckProfiles
      tags: [devices]
      summary: List Stream Deck profiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamDeckProfile"
    post:
      operationId: createStreamDeckProfile
      tags: [devices]
      summary: Create a Stream Deck profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamDeckProfileInput"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamDeckProfile"

  /overlays/templates:
    get:
      operationId: getOverlayTemplates
      tags: [overlays]
      summary: List overlay templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OverlayTemplate"

  /overlays/state:
    get:
      operationId: getOverlayState
      tags: [overlays]
      summary: Get current overlay state
      responses:
        "200":
          description: Overlay state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayState"

  /streaming/destinations:
    get:
      operationId: getStreamingDestinations
      tags: [streaming]
      summary: List streaming destinations
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamingDestination"
    post:
      operationId: createStreamingDestination
      tags: [streaming]
      summary: Create a streaming destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamingDestinationInput"
      responses:
        "201":
          description: Destination created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamingDestination"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SystemStatus:
      type: object
      required:
        - camera
        - recording
        - streaming
        - streamDeck
        - joystick
        - storage
        - overlay
        - audio
      properties:
        camera:
          type: object
          required:
            - connectionState
            - cameraId
          properties:
            connectionState:
              type: string
            cameraId:
              type: string
            model:
              type:
                - string
                - "null"

        recording:
          type: object
          required:
            - state
            - elapsedSeconds
            - segmentCount
          properties:
            state:
              type: string
            elapsedSeconds:
              type: integer
            segmentCount:
              type: integer
            outputDirectory:
              type:
                - string
                - "null"

        streaming:
          type: object
          required:
            - state
          properties:
            state:
              type: string
            stats:
              type:
                - object
                - "null"
              additionalProperties: true

        streamDeck:
          type: object
          required:
            - connected
          properties:
            connected:
              type: boolean
            deviceName:
              type:
                - string
                - "null"
            activeProfileId:
              type:
                - string
                - "null"

        joystick:
          type: object
          required:
            - connected
          properties:
            connected:
              type: boolean
            deviceName:
              type:
                - string
                - "null"

        storage:
          type: object
          required:
            - availableMinutes
            - warningLevel
            - availableBytes
          properties:
            availableMinutes:
              type: integer
            warningLevel:
              type: string
            availableBytes:
              type: integer
              format: int64

        overlay:
          type: object
          required:
            - isVisible
            - outputMode
          properties:
            isVisible:
              type: boolean
            outputMode:
              type: string
            activeTemplateId:
              type:
                - string
                - "null"

        audio:
          type: object
          required:
            - state
          properties:
            state:
              type: string

    Camera:
      type: object
      required: [cameraId, name, manufacturer, adapter, ipAddress, rtspUrl, connectionState, createdAt]
      properties:
        cameraId:
          type: string
        name:
          type: string
        manufacturer:
          type: string
          enum: [axis, canon, panasonic, sony, ptzoptics, birddog, aver, bolin, onvif, generic-rtsp]
        adapter:
          type: string
        model:
          type: ["string", "null"]
        ipAddress:
          type: string
        rtspUrl:
          type: string
        username:
          type: ["string", "null"]
        streamProfile:
          type: ["string", "null"]
        codec:
          type: ["string", "null"]
        resolution:
          type: ["string", "null"]
        frameRate:
          type: ["integer", "null"]
        connectionState:
          type: string
          enum: [connected, disconnected, connecting, error]
        healthState:
          type: ["string", "null"]
        firmwareVersion:
          type: ["string", "null"]
        serialNumber:
          type: ["string", "null"]
        bitRate:
          type: ["integer", "null"]
        droppedFrames:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    CameraInput:
      type: object
      required: [name, manufacturer, adapter, ipAddress, rtspUrl]
      properties:
        name:
          type: string
        manufacturer:
          type: string
          enum: [axis, canon, panasonic, sony, ptzoptics, birddog, aver, bolin, onvif, generic-rtsp]
        adapter:
          type: string
        model:
          type: string
        ipAddress:
          type: string
        rtspUrl:
          type: string
        username:
          type: string
        password:
          type: string
        streamProfile:
          type: string
        codec:
          type: string
        resolution:
          type: string
        frameRate:
          type: integer

    CameraConnectionResult:
      type: object
      required: [success, connectionState]
      properties:
        success:
          type: boolean
        connectionState:
          type: string
        message:
          type: ["string", "null"]
        cameraId:
          type: string

    CameraTestResult:
      type: object
      required: [success, latencyMs]
      properties:
        success:
          type: boolean
        latencyMs:
          type: ["integer", "null"]
        resolution:
          type: ["string", "null"]
        frameRate:
          type: ["number", "null"]
        bitRate:
          type: ["integer", "null"]
        message:
          type: ["string", "null"]

    PtzCommand:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pan-left, pan-right, tilt-up, tilt-down, zoom-in, zoom-out, stop, home, preset-recall, preset-save, emergency-wide]
        panSpeed:
          type: ["number", "null"]
        tiltSpeed:
          type: ["number", "null"]
        zoomSpeed:
          type: ["number", "null"]
        presetId:
          type: ["string", "null"]
        presetName:
