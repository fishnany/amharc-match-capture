        scoreAfter:
          type: ["string", "null"]
        clipRequested:
          type: boolean
        reviewStatus:
          type: string
          enum: [unreviewed, reviewed, corrected, rejected, flagged]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

