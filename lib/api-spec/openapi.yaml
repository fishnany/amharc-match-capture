          type: ["number", "null"]
        tiltSpeed:
          type: ["number", "null"]
        zoomSpeed:
          type: ["number", "null"]
        presetId:
          type: ["string", "null"]
        presetName:
          type: ["string", "null"]

    PtzPreset:
      type: object
      required: [presetId, name, cameraId]
      properties:
        presetId:
          type: string
        name:
          type: string
        cameraId:
          type: string
        description:
          type: ["string", "null"]
        isDefault:
          type: boolean

    PtzPresetInput:
      type: object
      required: [name]
